repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # Submission CSVs must be byte-for-byte what cse151b-sc generated;
      # any auto-fix to whitespace inside a model response is a silent
      # mutation of what the leaderboard sees. Same for milestone PDF
      # binary artifacts.
      - id: trailing-whitespace
        exclude: '^submissions/.*\.csv$|^results/.*\.jsonl$|^templates/milestone-report/'
      - id: end-of-file-fixer
        exclude: '^submissions/.*\.csv$|^results/.*\.jsonl$|^templates/milestone-report/'
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        # 51200 KB = 50 MB. Sized to allow:
        # - uv.lock (~1.7 MB)
        # - submission CSVs that contain full SC thinking traces (~18 MB at K=8;
        #   could go ~30 MB at K=16). Each row's `response` is a multi-thousand-
        #   token thinking trace, which makes raw bytes significant.
        # GitHub hard-limit is 100 MB per file — 50 MB stays well under that.
        args: ['--maxkb=51200']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        exclude: '^starter_code_cse151b_comp\.ipynb$'
      - id: ruff-format
        exclude: '^starter_code_cse151b_comp\.ipynb$'
